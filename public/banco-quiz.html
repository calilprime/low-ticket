<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Banco Quiz — Não Desiste</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<!--
  Painel do quiz do Não Desiste. Lê só agregados (funções security definer em
  supabase/quiz-nao-desiste.sql); a chave anon não lê nenhuma linha da tabela.

  O que ele responde que o do Mãe Serena não respondia:
  - Onde o quiz vaza POR ANÚNCIO (utm_content), não só no total.
  - Se a mãe viu o preço (oferta_vista) — antes "Mini LP" era gravada junto com
    o resultado e repetia o mesmo número.
  - Quanto tempo leva até o resultado e do resultado até o checkout.
  - Checkout por perfil: qual resultado convence mais.

  O que ele NÃO responde, de propósito: venda. Venda é da HeroSpark/UTMify,
  agrupada pelo nome do anúncio. O quiz × LP se decide lá, comparando o
  Jantar-QUIZ com o Jantar-LP.
-->
<style>
:root{
  --fundo:oklch(0.975 0.008 85);
  --cartao:oklch(1 0.004 85);
  --borda:oklch(0.9 0.014 80);
  --texto:oklch(0.28 0.012 60);
  --mutado:oklch(0.5 0.02 70);
  --oliva:oklch(0.34 0.03 135);
  --ouro:oklch(0.74 0.09 80);
  --terracota:oklch(0.58 0.13 45);
  --verde:oklch(0.62 0.17 150);
  --alerta:oklch(0.55 0.18 28);
  --alerta-bg:oklch(0.96 0.03 28);
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;padding:26px 16px 70px;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:28px;color:var(--oliva)}
h1 small{display:block;font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--terracota);margin-bottom:4px}
.sub{color:var(--mutado);font-size:12px;font-family:var(--mono);margin:8px 0 22px}
.controles{display:flex;gap:8px;flex-wrap:wrap}
select,button{font:inherit;background:var(--cartao);border:1px solid var(--borda);border-radius:10px;padding:8px 12px;color:var(--texto);cursor:pointer}
select{max-width:260px}
button:hover,select:hover{border-color:var(--ouro)}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

.aviso{background:var(--cartao);border:1px solid var(--borda);border-left:4px solid var(--ouro);border-radius:10px;padding:13px 16px;margin-bottom:18px;font-size:13px;line-height:1.6}
.erro{background:var(--alerta-bg);border:1px solid color-mix(in oklab,var(--alerta) 25%,transparent);border-left:4px solid var(--alerta);border-radius:10px;padding:13px 16px;margin-bottom:18px;font-size:13.5px}
.erro code{font-family:var(--mono);font-size:12px;background:var(--cartao);padding:1px 5px;border-radius:4px}
[hidden]{display:none!important}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.kpi{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px 16px}
.kpi span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mutado)}
.kpi b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--mutado);margin-top:2px}
.kpi.destaque{border-color:color-mix(in oklab,var(--verde) 45%,transparent);background:color-mix(in oklab,var(--verde) 6%,var(--cartao))}

.abas{display:inline-flex;gap:2px;background:var(--cartao);border:1px solid var(--borda);border-radius:12px;padding:4px;margin-bottom:18px;max-width:100%;overflow-x:auto}
.aba{border:0;background:transparent;border-radius:8px;padding:8px 14px;color:var(--mutado);font-weight:600;white-space:nowrap}
.aba[aria-selected="true"]{background:var(--oliva);color:oklch(0.97 0.01 85)}

.cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:18px;margin-bottom:16px}
.cartao h3{margin:0 0 14px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mutado)}

/* funil */
.etapa{display:grid;grid-template-columns:minmax(150px,220px) 1fr 92px;gap:12px;align-items:center;padding:7px 0}
.etapa .nome{font-weight:600}
.etapa .nome small{display:block;font-weight:400;font-size:11.5px;color:var(--mutado)}
.etapa .trilho{height:22px;border-radius:6px;background:color-mix(in oklab,var(--ouro) 12%,var(--fundo));overflow:hidden}
.etapa .trilho i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ouro),var(--terracota))}
.etapa.fim .trilho i{background:linear-gradient(90deg,var(--verde),color-mix(in oklab,var(--verde) 70%,var(--oliva)))}
.etapa .num{font-family:var(--mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.etapa .num em{display:block;font-style:normal;font-size:11px;color:var(--mutado);font-weight:500}
.queda{margin:0 0 0 0;padding:0 0 2px;font-family:var(--mono);font-size:11.5px;color:var(--alerta)}
.queda.pior{font-weight:600}
.queda.pior::after{content:"  ← maior vazamento";color:var(--mutado);font-weight:500}
@media (max-width:560px){.etapa{grid-template-columns:1fr 70px}.etapa .trilho{grid-column:1 / -1;order:3}}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--borda);font-size:13.5px;vertical-align:top}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mutado);font-weight:700}
td.n{font-family:var(--mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.rolavel{overflow-x:auto}
.barrinha{display:block;height:5px;border-radius:3px;background:color-mix(in oklab,var(--ouro) 15%,var(--fundo));margin-top:6px}
.barrinha i{display:block;height:100%;border-radius:3px;background:var(--ouro)}
.vazio{color:var(--mutado);font-style:italic;padding:14px 0;text-align:center}
svg{display:block;width:100%;height:auto;overflow:visible}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mutado);margin-top:10px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>Devocional da Mãe que Não Desiste</small>Banco Quiz</h1>
    <div class="controles">
      <select id="periodo" aria-label="Período">
        <option value="1">Hoje</option>
        <option value="3">3 dias</option>
        <option value="7" selected>7 dias</option>
        <option value="14">14 dias</option>
        <option value="30">30 dias</option>
      </select>
      <select id="anuncio" aria-label="Anúncio"><option value="">Todos os anúncios</option></select>
      <button id="atualizar" type="button">Atualizar</button>
    </div>
  </header>
  <p class="sub" id="carimbo">carregando…</p>

  <div class="erro" id="erro" hidden></div>
  <div class="aviso" id="aviso" hidden></div>
  <div class="kpis" id="kpis"></div>

  <div class="abas" role="tablist">
    <button class="aba" role="tab" aria-selected="true" data-painel="p-funil">Funil</button>
    <button class="aba" role="tab" aria-selected="false" data-painel="p-anuncios">Por anúncio</button>
    <button class="aba" role="tab" aria-selected="false" data-painel="p-respostas">Respostas</button>
    <button class="aba" role="tab" aria-selected="false" data-painel="p-perfis">Perfis</button>
    <button class="aba" role="tab" aria-selected="false" data-painel="p-dia">Por dia</button>
  </div>

  <div class="painel" id="p-funil"><div class="cartao"><h3>Sessões que chegaram a cada etapa</h3><div id="funil"></div></div></div>
  <div class="painel" id="p-anuncios" hidden><div class="cartao"><h3>Por anúncio (utm_content)</h3><div class="rolavel" id="anuncios"></div></div></div>
  <div class="painel" id="p-respostas" hidden><div id="respostas"></div></div>
  <div class="painel" id="p-perfis" hidden><div class="cartao"><h3>Resultado entregue e quem foi ao checkout</h3><div class="rolavel" id="perfis"></div></div></div>
  <div class="painel" id="p-dia" hidden>
    <div class="cartao"><h3>Sessões por dia</h3><div id="linha"></div>
      <div class="legenda"><span><i style="background:var(--ouro)"></i>Abriu</span><span><i style="background:var(--terracota)"></i>Resultado</span><span><i style="background:var(--verde)"></i>Checkout</span></div>
    </div>
  </div>
</div>

<script>
(function(){
var CONFIG = {
  SUPABASE_URL: "https://asjakwljvzjotycmgtwd.supabase.co",
  SUPABASE_ANON: "sb_publishable_JqCQTveGtqP01owfv_1XOA_l3BSW63H",
  VARIANTE: "nd_quiz"
};

// Cadeia principal do funil. `para_lp` é desvio, não etapa — vai para os KPIs.
var CADEIA = ["abertura","p1","p2","p3","p4","compromisso","resultado","oferta_vista","checkout"];
var NOMES = {
  abertura:["Abriu o quiz","carregou a página"],
  p1:["Respondeu P1","a conversa hoje"],
  p2:["Respondeu P2","o que aperta primeiro"],
  p3:["Respondeu P3","na hora de orar"],
  p4:["Respondeu P4","já tentou conversar"],
  compromisso:["Compromisso","quando faria a primeira"],
  resultado:["Viu o resultado","perfil calculado"],
  oferta_vista:["Viu o preço","bloco de preço na tela"],
  checkout:["Foi pro checkout","clicou no botão"]
};
var PERGUNTAS = {
  p1:"P1 · Como está a conversa com ele hoje",
  p2:"P2 · O que aperta primeiro",
  p3:"P3 · Quando senta para orar",
  p4:"P4 · Já tentou resolver conversando",
  compromisso:"Compromisso · Quando faria a primeira"
};
var RESPOSTAS = {
  curta:"Curta, uma palavra só", briga:"Vira briga ou cobrança", nao_fala:"Quase não fala mais", outro_caminho:"Seguiu outro caminho",
  medo:"Medo do que pode acontecer", culpa:"Culpa, onde errei", saudade:"Saudade de como era", engasgado:"O que fica engasgado",
  palavras:"As palavras somem", ansiedade:"Oro com ansiedade", choro:"Choro mais do que oro", sem_sinal:"Não vejo sinal",
  piorou:"Várias vezes, piorou", medo_afastar:"Medo de afastar mais", desisti_falar:"Parei de tentar", pedi_desculpas:"Pedi desculpas, nada mudou",
  hoje:"Hoje, antes de dormir", amanha:"Amanhã cedo", ver_antes:"Quero entender melhor"
};
var PERFIL_NOME = {controle:"Dia 1 · controle", silencio:"Dia 2 · silêncio", cobranca:"Dia 3 · cobrança", culpa:"Dia 4 · culpa", persistir:"Dia 7 · persistir"};

var esc = function(s){ return String(s == null ? "—" : s).replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c];}); };
var pct = function(a,b){ return b ? a/b*100 : 0; };
var fmtSeg = function(s){ if(s==null) return "—"; s=Math.round(s); return s<60 ? s+"s" : Math.floor(s/60)+"min "+(s%60)+"s"; };

function rpc(fn, corpo){
  return fetch(CONFIG.SUPABASE_URL+"/rest/v1/rpc/"+fn,{
    method:"POST",
    headers:{apikey:CONFIG.SUPABASE_ANON,Authorization:"Bearer "+CONFIG.SUPABASE_ANON,"Content-Type":"application/json"},
    body:JSON.stringify(corpo)
  }).then(function(r){
    if(r.ok) return r.json();
    return r.text().then(function(t){ var e=new Error(fn+" devolveu HTTP "+r.status+". "+t.slice(0,200)); e.status=r.status; throw e; });
  });
}

document.querySelectorAll(".aba").forEach(function(a){
  a.addEventListener("click",function(){
    document.querySelectorAll(".aba").forEach(function(x){x.setAttribute("aria-selected", x===a);});
    document.querySelectorAll(".painel").forEach(function(p){p.hidden = p.id !== a.dataset.painel;});
  });
});

function pintarFunil(linhas){
  var alvo=document.getElementById("funil");
  var mapa={}; linhas.forEach(function(l){mapa[l.etapa]=Number(l.sessoes);});
  var topo=mapa.abertura||0;
  if(!topo){ alvo.innerHTML='<p class="vazio">Nenhuma sessão no período.</p>'; return mapa; }
  var quedas=CADEIA.map(function(e,i){ return i===0?0:Math.max(0,(mapa[CADEIA[i-1]]||0)-(mapa[e]||0)); });
  var pior=Math.max.apply(null,quedas);
  var html="";
  CADEIA.forEach(function(e,i){
    var n=mapa[e]||0, ant=i?(mapa[CADEIA[i-1]]||0):0;
    if(i>0 && quedas[i]>0 && ant>0){
      html+='<p class="queda'+(quedas[i]===pior?' pior':'')+'">↓ '+Math.round(quedas[i]/ant*100)+'% saem aqui ('+quedas[i]+')</p>';
    }
    var nm=NOMES[e]||[e,""];
    html+='<div class="etapa'+(e==="checkout"?' fim':'')+'"><span class="nome">'+esc(nm[0])+'<small>'+esc(nm[1])+'</small></span>'+
      '<span class="trilho"><i style="width:'+pct(n,topo).toFixed(1)+'%"></i></span>'+
      '<span class="num">'+n+'<em>'+pct(n,topo).toFixed(0)+'% do topo</em></span></div>';
  });
  alvo.innerHTML=html;
  return mapa;
}

function pintarAnuncios(linhas){
  var alvo=document.getElementById("anuncios");
  if(!linhas.length){ alvo.innerHTML='<p class="vazio">Sem sessões no período.</p>'; return; }
  alvo.innerHTML='<table><thead><tr><th>Anúncio</th><th class="n">Abriram</th><th class="n">Resp. P1</th><th class="n">Resultado</th><th class="n">Viu preço</th><th class="n">Checkout</th><th class="n">Ponta a ponta</th></tr></thead><tbody>'+
    linhas.map(function(l){
      return '<tr><td>'+esc(l.anuncio)+'</td><td class="n">'+l.abriram+'</td><td class="n">'+l.responderam+'<br><small>'+pct(l.responderam,l.abriram).toFixed(0)+'%</small></td><td class="n">'+l.resultado+'</td><td class="n">'+l.oferta+'</td><td class="n">'+l.checkout+'</td><td class="n">'+pct(l.checkout,l.abriram).toFixed(1)+'%</td></tr>';
    }).join("")+'</tbody></table>';
}

function pintarRespostas(linhas){
  var alvo=document.getElementById("respostas");
  var por={}; linhas.forEach(function(l){ (por[l.etapa]=por[l.etapa]||[]).push(l); });
  var ordem=["p1","p2","p3","p4","compromisso"].filter(function(e){return por[e];});
  if(!ordem.length){ alvo.innerHTML='<div class="cartao"><p class="vazio">Sem respostas ainda.</p></div>'; return; }
  alvo.innerHTML=ordem.map(function(et){
    var ls=por[et], tot=ls.reduce(function(a,b){return a+Number(b.total);},0);
    return '<div class="cartao"><h3>'+esc(PERGUNTAS[et])+'</h3><table><tbody>'+
      ls.map(function(l){ var p=pct(l.total,tot);
        return '<tr><td>'+esc(RESPOSTAS[l.resposta]||l.resposta)+'<span class="barrinha"><i style="width:'+p.toFixed(1)+'%"></i></span></td><td class="n">'+l.total+' · '+p.toFixed(0)+'%</td></tr>';
      }).join("")+'</tbody></table></div>';
  }).join("");
}

function pintarPerfis(linhas){
  var alvo=document.getElementById("perfis");
  if(!linhas.length){ alvo.innerHTML='<p class="vazio">Nenhum resultado entregue ainda.</p>'; return; }
  alvo.innerHTML='<table><thead><tr><th>Resultado</th><th class="n">Sessões</th><th class="n">Checkout</th><th class="n">Taxa</th></tr></thead><tbody>'+
    linhas.map(function(l){ return '<tr><td>'+esc(PERFIL_NOME[l.perfil]||l.perfil)+'</td><td class="n">'+l.sessoes+'</td><td class="n">'+l.checkout+'</td><td class="n">'+pct(l.checkout,l.sessoes).toFixed(0)+'%</td></tr>'; }).join("")+
    '</tbody></table>';
}

function pintarSerie(linhas){
  var el=document.getElementById("linha");
  var dias=[]; linhas.forEach(function(l){ if(dias.indexOf(l.dia)===-1) dias.push(l.dia); }); dias.sort();
  if(!dias.length){ el.innerHTML='<p class="vazio">Sem dados no período.</p>'; return; }
  var pega=function(e){ return dias.map(function(d){ var x=linhas.filter(function(l){return l.dia===d&&l.etapa===e;})[0]; return x?Number(x.sessoes):0; }); };
  var series=[{cor:"var(--ouro)",p:pega("abertura")},{cor:"var(--terracota)",p:pega("resultado")},{cor:"var(--verde)",p:pega("checkout")}];
  var W=760,H=210,L=34,R=10,T=10,B=24;
  var max=Math.max.apply(null,[1].concat(series[0].p,series[1].p,series[2].p));
  var x=function(i){ return L+(dias.length===1?(W-L-R)/2:i*(W-L-R)/(dias.length-1)); };
  var y=function(v){ return T+(H-T-B)*(1-v/max); };
  var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sessões por dia">';
  [0,.5,1].forEach(function(f){ var v=Math.round(max*f), yy=y(v);
    g+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="oklch(0.9 0.014 80)" stroke-dasharray="4"/><text x="0" y="'+(yy+4)+'" font-size="11" fill="oklch(0.5 0.02 70)" font-family="monospace">'+v+'</text>'; });
  series.forEach(function(s){
    g+='<path d="'+s.p.map(function(v,i){return (i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1);}).join(' ')+'" fill="none" stroke="'+s.cor+'" stroke-width="2.5" stroke-linejoin="round"/>';
    s.p.forEach(function(v,i){ g+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3.5" fill="'+s.cor+'"><title>'+dias[i]+': '+v+'</title></circle>'; });
  });
  dias.forEach(function(d,i){ if(dias.length>10 && i%Math.ceil(dias.length/7)) return;
    g+='<text x="'+x(i)+'" y="'+(H-4)+'" font-size="11" fill="oklch(0.5 0.02 70)" text-anchor="middle" font-family="monospace">'+d.slice(8)+'/'+d.slice(5,7)+'</text>'; });
  el.innerHTML=g+'</svg>';
}

var anunciosCarregados=false;
function carregar(){
  var dias=Number(document.getElementById("periodo").value);
  var content=document.getElementById("anuncio").value || null;
  var desde=new Date(Date.now()-dias*864e5).toISOString();
  var corpo={desde:desde,p_variante:CONFIG.VARIANTE,p_content:content};
  var erro=document.getElementById("erro"); erro.hidden=true;

  Promise.all([
    rpc("funil_quiz_v2",corpo), rpc("respostas_quiz_v2",corpo), rpc("perfis_quiz_v2",corpo),
    rpc("serie_quiz_v2",corpo), rpc("tempo_quiz_v2",corpo),
    rpc("anuncios_quiz_v2",{desde:desde,p_variante:CONFIG.VARIANTE})
  ]).then(function(r){
    var funil=r[0], respostas=r[1], perfis=r[2], serie=r[3], tempo=(r[4]&&r[4][0])||{}, anuncios=r[5];
    var m=pintarFunil(funil);
    var topo=m.abertura||0, p1=m.p1||0, res=m.resultado||0, ofe=m.oferta_vista||0, ck=m.checkout||0, lp=m.para_lp||0;

    document.getElementById("kpis").innerHTML=
      '<div class="kpi"><span>Abriram</span><b>'+topo+'</b><small>sessões no quiz</small></div>'+
      '<div class="kpi"><span>Começaram</span><b>'+pct(p1,topo).toFixed(0)+'%</b><small>'+p1+' responderam a P1</small></div>'+
      '<div class="kpi"><span>Concluíram</span><b>'+pct(res,p1).toFixed(0)+'%</b><small>'+res+' de quem começou</small></div>'+
      '<div class="kpi"><span>Preço → checkout</span><b>'+pct(ck,ofe).toFixed(0)+'%</b><small>'+ck+' de '+ofe+' que viram o preço</small></div>'+
      '<div class="kpi destaque"><span>Ponta a ponta</span><b>'+pct(ck,topo).toFixed(1)+'%</b><small>abertura → checkout</small></div>'+
      '<div class="kpi"><span>Tempo até resultado</span><b>'+fmtSeg(tempo.mediana_resultado_s)+'</b><small>mediana · decisão '+fmtSeg(tempo.mediana_decisao_s)+'</small></div>'+
      '<div class="kpi"><span>Foram para a LP</span><b>'+lp+'</b><small>preferiram a página completa</small></div>';

    var aviso=document.getElementById("aviso"); aviso.hidden=false;
    aviso.innerHTML = topo<30
      ? '<b>'+topo+'/30 aberturas.</b> Por enquanto os números servem para achar defeito de mecanismo — uma etapa que ninguém passa, um perfil que nunca sai. <b>Quiz × LP não se decide aqui:</b> compare as vendas do anúncio QUIZ com as do Jantar-LP na UTMify.'
      : '<b>'+topo+' aberturas.</b> Já dá para ler onde o quiz vaza. A decisão quiz × LP continua sendo venda por anúncio na UTMify — este painel explica o <i>porquê</i>, não o <i>se</i>.';

    pintarRespostas(respostas);
    pintarPerfis(perfis);
    pintarSerie(serie);
    pintarAnuncios(anuncios);

    if(!anunciosCarregados){
      var sel=document.getElementById("anuncio");
      anuncios.forEach(function(a){ var o=document.createElement("option"); o.value=a.anuncio==="(sem utm_content)"?"":a.anuncio; o.textContent=a.anuncio; if(o.value) sel.appendChild(o); });
      anunciosCarregados=true;
    }
    document.getElementById("carimbo").textContent="últimos "+dias+"d"+(content?" · "+content:"")+" · "+topo+" sessões · atualizado "+new Date().toLocaleTimeString("pt-BR");
  }).catch(function(e){
    erro.hidden=false;
    var dica = e.status===404
      ? 'As funções do painel <b>ainda não existem</b> no banco. Rode o arquivo <code>supabase/quiz-nao-desiste.sql</code> inteiro no SQL Editor do Supabase. Ele é idempotente e não mexe no quiz do Mãe Serena. <b>O quiz já está gravando</b> — só a leitura depende disso.'
      : (e.status===401||e.status===403)
      ? 'Chave recusada ou permissão faltando. Confira os <code>grant execute ... to anon</code> no fim do SQL.'
      : /Failed to fetch|NetworkError/i.test(e.message)
      ? 'Falha de rede: um bloqueador ou a conexão barrou a requisição ao Supabase.'
      : 'Erro inesperado. O texto veio direto do Supabase.';
    erro.innerHTML='<b>Não deu para ler os dados.</b><br>'+esc(e.message)+'<br><br>'+dica;
    document.getElementById("carimbo").textContent="falha na leitura";
  });
}
document.getElementById("atualizar").addEventListener("click",carregar);
document.getElementById("periodo").addEventListener("change",carregar);
document.getElementById("anuncio").addEventListener("change",carregar);
carregar();
})();
</script>
</body>
</html>
